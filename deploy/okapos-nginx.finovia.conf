# okapos-nginx konteyneriga qo'shiladigan conf.
# finovia.okaposai.uz -> finovia-web konteyneri (ichki port 80)
#
# 1) finovia-web ni okapos tarmog'iga ulang (bir marta):
#    docker network ls
#    docker network connect <OKAPOS_NETWORK> finovia-web
#
# 2) Bu faylni okapos nginx conf papkasiga qo'ying (volume joyiga qarab):
#    docker cp deploy/okapos-nginx.finovia.conf okapos-nginx:/etc/nginx/conf.d/finovia.conf
#    docker exec okapos-nginx nginx -t && docker exec okapos-nginx nginx -s reload
#
# 3) SSL (okapos-nginx allaqachon 443 ishlatadi):
#    docker exec okapos-nginx certbot --nginx -d finovia.okaposai.uz
#    yoki mavjud certbot jarayoningizga qo'shing

server {
    listen 80;
    listen [::]:80;
    server_name finovia.okaposai.uz;

    location / {
        proxy_pass http://finovia-web:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
