# =====================================================================
# SERVERDAGI (HOST) nginx konfiguratsiyasi
# finovia.okaposai.uz  ->  127.0.0.1:5174 (Docker konteyner)
#
# Joylashuv: /etc/nginx/sites-available/finovia.okaposai.uz.conf
# Faollashtirish: ln -s ../sites-available/... /etc/nginx/sites-enabled/
#
# Bu fayl HTTP (80) holatida. SSL'ni certbot avtomatik qo'shadi:
#   sudo certbot --nginx -d finovia.okaposai.uz
# certbot 443 blokini va HTTP->HTTPS redirectni o'zi qo'shadi.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name finovia.okaposai.uz;

    # Yuklash hajmi (kerak bo'lsa)
    client_max_body_size 20M;

    access_log /var/log/nginx/finovia.access.log;
    error_log  /var/log/nginx/finovia.error.log;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
